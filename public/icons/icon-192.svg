<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c0a0a"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <!-- Record -->
  <circle cx="96" cy="88" r="56" fill="url(#disc)" stroke="#333" stroke-width="2"/>
  <circle cx="96" cy="88" r="24" fill="#e74c3c"/>
  <circle cx="96" cy="88" r="6" fill="#f1c40f"/>
  <!-- Grooves -->
  <circle cx="96" cy="88" r="45" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <circle cx="96" cy="88" r="38" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <circle cx="96" cy="88" r="31" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
  <!-- Flags -->
  <g transform="translate(10, 10)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#e74c3c" stroke-width="1.5"/>
    <polygon points="2,0 18,5 2,10" fill="#f1c40f"/>
  </g>
  <g transform="translate(150, 12)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#2ecc71" stroke-width="1.5"/>
    <polygon points="2,0 16,4 2,8" fill="#e74c3c"/>
  </g>
  <!-- Text -->
  <text x="96" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#e74c3c">QS 2026</text>
</svg>
