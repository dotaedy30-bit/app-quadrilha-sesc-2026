<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c0a0a"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Record -->
  <circle cx="256" cy="240" r="160" fill="url(#disc)" stroke="#333" stroke-width="4"/>
  <circle cx="256" cy="240" r="70" fill="#e74c3c"/>
  <circle cx="256" cy="240" r="18" fill="#f1c40f"/>
  <!-- Grooves -->
  <circle cx="256" cy="240" r="130" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="256" cy="240" r="110" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="256" cy="240" r="90" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Flags -->
  <g transform="translate(30, 30)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#e74c3c" stroke-width="3"/>
    <polygon points="6,0 50,12 6,24" fill="#f1c40f"/>
  </g>
  <g transform="translate(410, 35)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#2ecc71" stroke-width="3"/>
    <polygon points="6,0 44,10 6,20" fill="#e74c3c"/>
  </g>
  <g transform="translate(35, 400)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#3498db" stroke-width="3"/>
    <polygon points="5,0 38,9 5,18" fill="#f1c40f"/>
  </g>
  <!-- Text -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="36" fill="#e74c3c">QS 2026</text>
</svg>
